<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tambah Pelanggan - Circo</title>
    <link rel="icon" type="image/svg+xml" href="assets/logo-icon.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="components/dashboard.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="components/loader.js"></script>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800">
    <div id="sidebar-backdrop" class="fixed inset-0 bg-slate-900/40 z-40 hidden md:hidden"></div>
    <aside id="sidebar"></aside>

    <div id="main-content">
        <header id="topbar" class="h-16 sticky top-0 z-30 bg-white border-b border-slate-100 shadow-xs"></header>

        <main class="flex-1 p-4 md:p-6 space-y-6">
            <!-- Header & Breadcrumb -->
            <div>
                <h1 class="text-xl md:text-2xl font-bold text-slate-900">Customer</h1>
                <div class="flex items-center gap-2 text-xs text-slate-400 mt-1 font-medium">
                    <span>Dashboard</span>
                    <i class="fa-solid fa-chevron-right text-[10px]"></i>
                    <span>Customer</span>
                    <i class="fa-solid fa-chevron-right text-[10px]"></i>
                    <span class="text-blue-600 font-semibold">Add Customer</span>
                </div>
            </div>

            <!-- Single Card Form View -->
            <div class="max-w-3xl bg-white p-5 md:p-8 rounded-2xl border border-slate-200/80 shadow-sm space-y-6">
                <div>
                    <h2 class="text-base font-bold text-slate-900">Customer</h2>
                    <p class="text-xs text-slate-400 mt-0.5">Lorem ipsum dolor sit amet consectetur. Non ac nulla aliquam aenean in velit mattis.</p>
                </div>

                <form action="pelanggan.html" class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1.5">Name Customer</label>
                        <input type="text" placeholder="Input name" class="w-full px-4 py-3 text-xs bg-white border border-slate-200 rounded-xl focus:outline-none focus:border-blue-500">
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 mb-1.5">Email</label>
                            <input type="email" placeholder="Input email" class="w-full px-4 py-3 text-xs bg-white border border-slate-200 rounded-xl focus:outline-none focus:border-blue-500">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 mb-1.5">No Handphone</label>
                            <input type="text" placeholder="Input no handphone" class="w-full px-4 py-3 text-xs bg-white border border-slate-200 rounded-xl focus:outline-none focus:border-blue-500">
                        </div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 mb-1.5">Purchases</label>
                            <input type="text" placeholder="Total Purchases" class="w-full px-4 py-3 text-xs bg-white border border-slate-200 rounded-xl focus:outline-none focus:border-blue-500">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 mb-1.5">Order Quantity</label>
                            <input type="text" placeholder="Order Quantity" class="w-full px-4 py-3 text-xs bg-white border border-slate-200 rounded-xl focus:outline-none focus:border-blue-500">
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1.5">Address</label>
                        <textarea placeholder="Input address" rows="4" class="w-full px-4 py-3 text-xs bg-white border border-slate-200 rounded-xl focus:outline-none focus:border-blue-500"></textarea>
                    </div>

                    <div class="pt-2">
                        <button type="submit" class="w-full py-3.5 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-xs font-semibold text-center shadow-lg shadow-blue-500/20 transition-all">
                            Save Customer
                        </button>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <script>
        $(document).ready(function() {
            initDashboardLayout('pelanggan');
        });
    </script>
</body>
</html>
