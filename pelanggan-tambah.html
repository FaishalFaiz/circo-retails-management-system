<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tambah Pelanggan - Circo</title>
    <link rel="icon" type="image/svg+xml" href="assets/logo-icon.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="components/dashboard.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="components/loader.js"></script>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800">
    <div id="sidebar-backdrop" class="fixed inset-0 bg-slate-900/40 z-40 hidden md:hidden"></div>
    <aside id="sidebar"></aside>

    <div id="main-content">
        <header id="topbar" class="h-16 sticky top-0 z-30 bg-white border-b border-slate-100 shadow-xs"></header>

        <main class="flex-1 p-4 md:p-6 space-y-6">
            <!-- Header & Breadcrumb -->
            <div>
                <h1 class="text-xl md:text-2xl font-bold text-slate-900">Tambah Pelanggan Baru</h1>
                <div class="flex items-center gap-2 text-xs text-slate-400 mt-1 font-medium">
                    <span>Dashboard</span>
                    <i class="fa-solid fa-chevron-right text-[10px]"></i>
                    <span>Daftar Pembeli</span>
                    <i class="fa-solid fa-chevron-right text-[10px]"></i>
                    <span class="text-blue-600 font-semibold">Tambah Pelanggan</span>
                </div>
            </div>

            <!-- Single Card Form View -->
            <div class="max-w-3xl bg-white p-5 md:p-8 rounded-2xl border border-slate-200/80 shadow-sm space-y-6">
                <div class="border-b border-slate-100 pb-4">
                    <h2 class="text-base font-bold text-slate-900">Formulir Pendaftaran Pelanggan & Kasbon</h2>
                    <p class="text-xs text-slate-400 mt-0.5">Daftarkan pelanggan toko untuk mempermudah transaksi kasbon dan pencatatan riwayat utang piutang.</p>
                </div>

                <form action="pelanggan.html" class="space-y-4">
                    <!-- Nama Pelanggan & Kategori/Tipe -->
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 mb-1.5">Nama Lengkap Pelanggan</label>
                            <input type="text" placeholder="Contoh: Bu Sulastri / Pak Agus" class="w-full px-4 py-3 text-xs bg-white border border-slate-200 rounded-xl focus:outline-none focus:border-blue-500">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 mb-1.5">Kategori Pelanggan</label>
                            <select class="w-full px-4 py-3 text-xs bg-white border border-slate-200 rounded-xl focus:outline-none focus:border-blue-500 text-slate-700">
                                <option>Warga Sekitar / Tetangga</option>
                                <option>Pelanggan Setia / Langganan</option>
                                <option>Warung Makan / Usaha Kemitraan</option>
                                <option>Umum</option>
                            </select>
                        </div>
                    </div>

                    <!-- No. WhatsApp / Handphone & Limit Kasbon -->
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 mb-1.5">No. WhatsApp / HP</label>
                            <input type="text" placeholder="Contoh: 0819-1314-1435" class="w-full px-4 py-3 text-xs bg-white border border-slate-200 rounded-xl focus:outline-none focus:border-blue-500">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 mb-1.5">Batas Maksimal Kasbon / Limit Plafon (Rp)</label>
                            <input type="text" placeholder="Contoh: Rp 500.000" class="w-full px-4 py-3 text-xs bg-white border border-slate-200 rounded-xl focus:outline-none focus:border-blue-500">
                        </div>
                    </div>

                    <!-- Alamat Lengkap & RT/RW -->
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1.5">Alamat Domisili / Catatan Rumah (RT/RW)</label>
                        <textarea placeholder="Contoh: RT 03 / RW 02 Des. Sukamaju (Depan Masjid Al-Ikhlas)" rows="3" class="w-full px-4 py-3 text-xs bg-white border border-slate-200 rounded-xl focus:outline-none focus:border-blue-500"></textarea>
                    </div>

                    <!-- Catatan Tambahan -->
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1.5">Catatan Khusus Toko (Opsional)</label>
                        <input type="text" placeholder="Contoh: Biasanya bayar utang tiap tanggal 15 awal bulan" class="w-full px-4 py-3 text-xs bg-white border border-slate-200 rounded-xl focus:outline-none focus:border-blue-500">
                    </div>

                    <!-- Save Customer Button -->
                    <div class="pt-3 flex gap-3">
                        <a href="pelanggan.html" class="flex-1 py-3.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-xs font-semibold text-center">Batal</a>
                        <button type="submit" class="flex-1 py-3.5 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-xs font-semibold text-center shadow-lg shadow-blue-500/20 transition-all">
                            Simpan Data Pelanggan
                        </button>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <script>
        $(document).ready(function() {
            initDashboardLayout('pelanggan');
        });
    </script>
</body>
</html>
