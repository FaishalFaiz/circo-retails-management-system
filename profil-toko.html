<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil Toko - Circo</title>
    <link rel="icon" type="image/svg+xml" href="assets/logo-icon.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="components/dashboard.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="components/loader.js"></script>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800">
    <div id="sidebar-backdrop" class="fixed inset-0 bg-slate-900/40 z-40 hidden md:hidden"></div>
    <aside id="sidebar"></aside>

    <div id="main-content">
        <header id="topbar" class="h-16 sticky top-0 z-30 bg-white border-b border-slate-100 shadow-xs"></header>

        <main class="flex-1 p-4 md:p-6 space-y-6">
            <!-- Header & Breadcrumb -->
            <div>
                <h1 class="text-xl md:text-2xl font-bold text-slate-900">Profil Toko</h1>
                <div class="flex items-center gap-2 text-xs text-slate-400 mt-1 font-medium">
                    <a href="dashboard.html">Dashboard</a>
                    <i class="fa-solid fa-chevron-right text-[10px]"></i>
                    <span class="text-blue-600 font-semibold">Profil Toko</span>
                </div>
            </div>

            <!-- Store Information Card -->
            <div class="bg-white p-5 md:p-7 rounded-2xl border border-slate-200/80 shadow-sm space-y-6">
                <h2 class="text-base font-bold text-slate-900">Informasi Toko</h2>
                <div class="flex items-center gap-4">
                    <div class="w-20 h-20 bg-yellow-300 rounded-2xl flex items-center justify-center border-2 border-amber-400 overflow-hidden">
                        <img src="assets/logo-icon.svg" alt="Logo Toko" class="w-full h-full object-contain" />
                    </div>
                    <button class="flex items-center gap-2 px-4 py-2.5 border border-slate-200 hover:bg-slate-50 rounded-xl text-xs font-semibold text-slate-700">
                        <span>Ubah Logo</span>
                        <img src="assets/icons/edit-03.svg" class="w-4 h-4" />
                    </button>
                </div>

                <form class="space-y-4">
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 mb-1.5">Nama Toko</label>
                            <input type="text" value="Toko Contoh" class="w-full px-4 py-3 text-xs bg-white border border-slate-200 rounded-xl font-medium text-slate-800" />
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 mb-1.5">Tagline / Slogan</label>
                            <input type="text" value="Solusi Retail Cerdas" class="w-full px-4 py-3 text-xs bg-white border border-slate-200 rounded-xl font-medium text-slate-800" />
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 mb-1.5">Email Toko</label>
                            <input type="email" value="info@tokocontoh.id" class="w-full px-4 py-3 text-xs bg-white border border-slate-200 rounded-xl font-medium text-slate-800" />
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 mb-1.5">Kategori Usaha</label>
                            <input type="text" value="Retail" class="w-full px-4 py-3 text-xs bg-white border border-slate-200 rounded-xl font-medium text-slate-800" />
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 mb-1.5">Tanggal Berdiri</label>
                            <input type="date" value="2020-01-15" class="w-full px-4 py-3 text-xs bg-white border border-slate-200 rounded-xl font-medium text-slate-800" />
                        </div>
                    </div>

                    <div class="flex items-center gap-3 pt-2">
                        <button type="button" class="px-6 py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-xs font-semibold shadow-md shadow-blue-500/20">Simpan</button>
                        <button type="button" class="px-6 py-3 text-blue-600 hover:underline text-xs font-semibold">Batal</button>
                    </div>
                </form>
            </div>

            <!-- Contact Detail Card (reuse) -->
            <div class="bg-white p-5 md:p-7 rounded-2xl border border-slate-200/80 shadow-sm space-y-5">
                <div class="flex items-center justify-between">
                    <h2 class="text-base font-bold text-slate-900">Detail Kontak</h2>
                    <button class="flex items-center gap-2 px-4 py-2 border border-slate-200 rounded-xl text-xs font-semibold text-slate-700 hover:bg-slate-50">
                        <span>Edit</span>
                        <img src="assets/icons/edit-03.svg" class="w-3.5 h-3.5" />
                    </button>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-4 text-xs">
                    <div>
                        <p class="font-semibold text-slate-700 mb-1.5">Nomor Telepon</p>
                        <div class="p-3 bg-slate-100/80 rounded-xl text-slate-800 font-semibold">+62 812 3456 7890</div>
                    </div>
                    <div>
                        <p class="font-semibold text-slate-700 mb-1.5">Negara</p>
                        <div class="p-3 bg-slate-100/80 rounded-xl text-slate-800 font-semibold">Indonesia</div>
                    </div>
                    <div>
                        <p class="font-semibold text-slate-700 mb-1.5">Alamat</p>
                        <div class="p-3 bg-slate-100/80 rounded-xl text-slate-800 font-semibold">Jl. Contoh No.123, Bandung</div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        $(document).ready(function() {
            initDashboardLayout('profil-toko');
        });
    </script>
</body>
</html>
