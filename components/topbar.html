<!-- Desktop Topbar -->
<div class="hidden md:flex items-center justify-between h-full px-6 bg-white border-b border-slate-100">
    <!-- Search Bar -->
    <div class="relative w-80">
        <input type="text" placeholder="Cari Produk" class="w-full bg-slate-50 border border-slate-200/80 rounded-xl pl-4 pr-10 py-2 text-xs text-slate-700 focus:outline-none focus:border-blue-500 focus:bg-white transition-colors">
        <button class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600">
            <img src="assets/icons/search.svg" alt="Search" class="w-4 h-4">
        </button>
    </div>

    <!-- Right Controls -->
    <div class="flex items-center gap-4">
        <!-- Notification Button -->
        <button class="relative p-2 rounded-xl text-slate-500 hover:bg-slate-50 transition-colors">
            <img src="assets/icons/notifications.svg" alt="Notifications" class="w-5 h-5">
            <span class="absolute top-1.5 right-1.5 w-4 h-4 bg-red-500 text-white text-[9px] font-bold rounded-full flex items-center justify-center border-2 border-white">8</span>
        </button>

        <div class="h-6 w-[1px] bg-slate-200"></div>

        <!-- User Profile Dropdown -->
        <div class="flex items-center gap-3 cursor-pointer">
            <div class="relative">
                <div class="w-9 h-9 bg-yellow-300 rounded-full flex items-center justify-center overflow-hidden border border-amber-400">
                    <i class="fa-solid fa-user text-amber-700 text-sm"></i>
                </div>
                <span class="w-2.5 h-2.5 bg-emerald-500 border-2 border-white rounded-full absolute bottom-0 right-0"></span>
            </div>
            <div class="text-left">
                <p class="text-xs font-bold text-slate-800 leading-tight">Sulis Fatmawati</p>
                <p class="text-[10px] text-slate-400 font-medium">Admin</p>
            </div>
        </div>
    </div>
</div>

<!-- Mobile Topbar -->
<div class="flex md:hidden items-center justify-between h-full px-4 bg-white border-b border-slate-100">
    <div class="flex items-center gap-3">
        <div class="relative">
            <div class="w-8 h-8 bg-yellow-300 rounded-full flex items-center justify-center overflow-hidden border border-amber-400">
                <i class="fa-solid fa-user text-amber-700 text-xs"></i>
            </div>
            <span class="w-2.5 h-2.5 bg-emerald-500 border-2 border-white rounded-full absolute bottom-0 right-0"></span>
        </div>
        <div>
            <p class="text-xs font-bold text-slate-800 leading-none mb-0.5">Sulis Fatmawati</p>
            <p class="text-[10px] text-slate-400 font-medium leading-none">Admin</p>
        </div>
    </div>

    <div class="flex items-center gap-2">
        <button class="p-2 text-slate-600 rounded-lg hover:bg-slate-50">
            <img src="assets/icons/search.svg" alt="Search" class="w-5 h-5">
        </button>
        <button id="mobile-menu-btn" class="p-2 text-slate-600 rounded-lg hover:bg-slate-50">
            <img src="assets/icons/menu.svg" alt="Menu" class="w-6 h-6">
        </button>
    </div>
</div>
