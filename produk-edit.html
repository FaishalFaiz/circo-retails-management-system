<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Product - Circo</title>
    <link rel="icon" type="image/svg+xml" href="assets/logo-icon.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="components/dashboard.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="components/loader.js"></script>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800">
    <div id="sidebar-backdrop" class="fixed inset-0 bg-slate-900/40 z-40 hidden md:hidden"></div>
    <aside id="sidebar" class="fixed top-0 bottom-0 left-0 bg-white border-r border-slate-100 z-50 flex flex-col"></aside>
    <div id="sidebar-container"></div>

    <div id="main-content" class="md:ml-[230px] flex flex-col min-h-screen">
        <header id="topbar-container" class="h-16 sticky top-0 z-30"></header>

        <main class="flex-1 p-4 md:p-6 space-y-6">
            <!-- Header & Breadcrumb -->
            <div>
                <h1 class="text-xl md:text-2xl font-bold text-slate-900">Product</h1>
                <div class="flex items-center gap-2 text-xs text-slate-400 mt-1 font-medium">
                    <span>Dashboard</span>
                    <i class="fa-solid fa-chevron-right text-[10px]"></i>
                    <span>Product</span>
                    <i class="fa-solid fa-chevron-right text-[10px]"></i>
                    <span>Sneakers</span>
                    <i class="fa-solid fa-chevron-right text-[10px]"></i>
                    <span class="text-blue-600 font-semibold">Edit Product</span>
                </div>
            </div>

            <!-- Form Content Grid -->
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 items-start">
                <!-- Left 2-Column: Form Information -->
                <div class="lg:col-span-2 bg-white p-5 md:p-7 rounded-2xl border border-slate-200/80 shadow-sm space-y-6">
                    <div>
                        <h2 class="text-base font-bold text-slate-900">Product Information</h2>
                        <p class="text-xs text-slate-400 mt-0.5">Lorem ipsum dolor sit amet consectetur. Non ac nulla aliquam aenean in velit mattis.</p>
                    </div>

                    <form class="space-y-4">
                        <!-- SKU -->
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 mb-1.5">SKU</label>
                            <input type="text" value="yogavwijaya@gmail" class="w-full px-4 py-3 text-xs bg-white border border-blue-500 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500/20 text-slate-800 font-medium">
                        </div>

                        <!-- Product Name -->
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 mb-1.5">Product Name</label>
                            <input type="text" value="Story Kitadake" class="w-full px-4 py-3 text-xs bg-white border border-slate-200 rounded-xl focus:outline-none focus:border-blue-500 text-slate-800 font-medium">
                        </div>

                        <!-- Size & Color -->
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs font-semibold text-slate-700 mb-1.5">Size</label>
                                <input type="text" value="44" class="w-full px-4 py-3 text-xs bg-white border border-slate-200 rounded-xl focus:outline-none focus:border-blue-500 text-slate-800 font-medium">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-700 mb-1.5">Color</label>
                                <input type="text" value="Red WHite" class="w-full px-4 py-3 text-xs bg-white border border-slate-200 rounded-xl focus:outline-none focus:border-blue-500 text-slate-800 font-medium">
                            </div>
                        </div>

                        <!-- Category & Price -->
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs font-semibold text-slate-700 mb-1.5">Product Category</label>
                                <select class="w-full px-4 py-3 text-xs bg-white border border-slate-200 rounded-xl focus:outline-none focus:border-blue-500 text-slate-800 font-medium">
                                    <option>Sneakers</option>
                                    <option>Jacket</option>
                                    <option>T-Shirt</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-700 mb-1.5">Price</label>
                                <input type="text" value="$22.00" class="w-full px-4 py-3 text-xs bg-white border border-slate-200 rounded-xl focus:outline-none focus:border-blue-500 text-slate-800 font-medium">
                            </div>
                        </div>

                        <!-- Quantity -->
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 mb-1.5">Quantity</label>
                            <input type="text" value="1112" class="w-full px-4 py-3 text-xs bg-white border border-slate-200 rounded-xl focus:outline-none focus:border-blue-500 text-slate-800 font-medium">
                        </div>

                        <!-- Status Product -->
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 mb-1.5">Status Product</label>
                            <select class="w-full px-4 py-3 text-xs bg-white border border-slate-200 rounded-xl focus:outline-none focus:border-blue-500 text-slate-400">
                                <option value="">Select status product</option>
                                <option selected>Available</option>
                                <option>Out of Stock</option>
                            </select>
                        </div>
                    </form>
                </div>

                <!-- Right Column: Image Preview & Save/Discard Actions -->
                <div class="space-y-6">
                    <div class="bg-white p-5 md:p-6 rounded-2xl border border-slate-200/80 shadow-sm space-y-4">
                        <div>
                            <h2 class="text-base font-bold text-slate-900">Image Product</h2>
                            <p class="text-[11px] text-slate-400 mt-0.5">
                                <span class="text-blue-600 font-semibold">Note :</span> Format photos SVG, PNG, or JPG (Max size 4mb)
                            </p>
                        </div>

                        <!-- Image Slots: Photo 1 filled, others empty -->
                        <div class="grid grid-cols-2 gap-3">
                            <div class="border border-slate-200 bg-slate-50 rounded-xl p-2 flex items-center justify-center h-28">
                                <img src="assets/image/taro_3x.webp" alt="Product" class="max-h-full object-contain">
                            </div>
                            <label class="border-2 border-dashed border-blue-400/60 bg-blue-50/20 hover:bg-blue-50/50 rounded-xl p-4 flex flex-col items-center justify-center gap-2 cursor-pointer transition-colors h-28 text-center">
                                <img src="assets/icons/image.svg" alt="Upload" class="w-6 h-6 text-blue-500">
                                <span class="text-[10px] font-semibold text-blue-600">Photo 2</span>
                                <input type="file" class="hidden">
                            </label>
                            <label class="border-2 border-dashed border-blue-400/60 bg-blue-50/20 hover:bg-blue-50/50 rounded-xl p-4 flex flex-col items-center justify-center gap-2 cursor-pointer transition-colors h-28 text-center">
                                <img src="assets/icons/image.svg" alt="Upload" class="w-6 h-6 text-blue-500">
                                <span class="text-[10px] font-semibold text-blue-600">Photo 3</span>
                                <input type="file" class="hidden">
                            </label>
                            <label class="border-2 border-dashed border-blue-400/60 bg-blue-50/20 hover:bg-blue-50/50 rounded-xl p-4 flex flex-col items-center justify-center gap-2 cursor-pointer transition-colors h-28 text-center">
                                <img src="assets/icons/image.svg" alt="Upload" class="w-6 h-6 text-blue-500">
                                <span class="text-[10px] font-semibold text-blue-600">Photo 4</span>
                                <input type="file" class="hidden">
                            </label>
                        </div>
                    </div>

                    <!-- Actions Buttons -->
                    <div class="flex items-center gap-3">
                        <a href="produk.html" class="flex-1 px-4 py-3.5 border border-blue-500 text-blue-600 rounded-xl text-xs font-semibold text-center hover:bg-blue-50 transition-all">
                            Discard Changes
                        </a>
                        <a href="produk.html" class="flex-1 px-4 py-3.5 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-xs font-semibold text-center shadow-lg shadow-blue-500/20 transition-all">
                            Save Changes
                        </a>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        $(document).ready(function() {
            initDashboardLayout('produk');
        });
    </script>
</body>
</html>
